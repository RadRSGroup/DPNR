version: "3.9"
services:
  db:
    image: postgres:15-alpine
    container_name: dpnr_db
    environment:
      POSTGRES_USER: dpnr
      POSTGRES_PASSWORD: dpnr
      POSTGRES_DB: dpnr
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: dpnr_web
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}
      - NEXT_PUBLIC_USER_POOL_ID=${NEXT_PUBLIC_USER_POOL_ID}
      - NEXT_PUBLIC_CLIENT_ID=${NEXT_PUBLIC_CLIENT_ID}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      - db
    ports:
      - "3000:3000"

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: dpnr_admin
    env_file: .env
    depends_on:
      - db
    ports:
      - "3001:3000"

  mcp-materials:
    build:
      context: ./mcp/materials-stub
      dockerfile: Dockerfile
    container_name: dpnr_mcp_materials
    ports:
      - "7070:7070"
    environment:
      - PORT=7070

volumes:
  db_data:

