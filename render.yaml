services:
  - type: web
    name: dpnr-web
    env: node
    branch: dpnr_course_site
    buildCommand: npm ci && npm run -w @dpnr/web build
    startCommand: npm run -w @dpnr/web start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Add your runtime env here or in the Render dashboard.
