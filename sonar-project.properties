# SonarCloud configuration for DPNR project
sonar.projectKey=dpnr_course_registration
sonar.organization=dpnr-org

# Project metadata
sonar.projectName=DPNR Course Registration Platform
sonar.projectVersion=1.0

# Source directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/**/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/coverage/**,**/dist/**,**/build/**,**/.next/**

# Test inclusions
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage reports
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Language configuration
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Quality gate settings
sonar.qualitygate.wait=true

# Analysis settings
sonar.sourceEncoding=UTF-8